name: 编译 RAX3000M NAND 固件

on:
  workflow_dispatch:            # 在仓库 Actions 页面手动点击运行
  push:
    branches: ['25.12']
    paths:
      - 'build-rax3000m.sh'
      - '.github/workflows/build-rax3000m.yml'
      - 'defconfig/mt7981-rax3000m-nand.config'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-pip python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils

      - name: 一键编译
        run: bash build-rax3000m.sh

      - name: 上传固件与插件包
        uses: actions/upload-artifact@v4
        with:
          name: rax3000m-nand-firmware
          path: |
            bin/targets/mediatek/filogic/*.bin
            bin/targets/mediatek/filogic/*.itb
            bin/targets/mediatek/filogic/packages/*.ipk
          if-no-files-found: error
