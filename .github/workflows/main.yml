name: Build ImmortalWrt MT798x (RAX3000M NAND)
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'defconfig/**'
      - 'feeds.conf.default'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-dev python3-pip rsync unzip zlib1g-dev file wget \
            libelf-dev ccache rename

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply defconfig
        run: |
          cp defconfig/mt7981-ax3000.config .config
          make defconfig

      - name: Download packages
        run: |
          make download -j$(nproc)
        # 删除 continue-on-error: true，下载失败直接终止

      - name: Build image
        run: |
          set -e
          make -j$(nproc) || { echo "多核编译失败，切换单核编译"; make -j1 V=s; }

      - name: Debug 检查输出目录
        run: |
          ls -la bin/targets/mediatek/filogic/
          du -sh bin/targets/mediatek/filogic/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-rax3000m-firmware
          path: |
            bin/targets/mediatek/filogic/*rax3000m*-sysupgrade.itb
            bin/targets/mediatek/filogic/*rax3000m*-factory.itb
            bin/targets/mediatek/filogic/*rax3000m*-preloader.bin
          if-no-files-found: error
