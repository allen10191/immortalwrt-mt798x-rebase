name: Build ImmortalWrt MT798x (RAX3000M NAND)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'defconfig/**'
      - 'feeds.conf.default'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-dev python3-pip rsync unzip zlib1g-dev file wget \
            libelf-dev ccache rename

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply defconfig
        run: |
          cp defconfig/mt7981-ax3000.config .config
          make defconfig

      - name: Download packages
        run: |
          make download -j$(nproc)
        continue-on-error: true

      - name: Build image
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-rax3000m-firmware
          path: |
            bin/targets/mediatek/filogic/*rax3000m*-sysupgrade.bin
            bin/targets/mediatek/filogic/*rax3000m*-factory.bin
            bin/targets/mediatek/filogic/*rax3000m*-preloader.bin
          if-no-files-found: warn
